<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" width="1100" height="210" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pipeline overview</title>
  <desc id="d">Six phases from ingestion to Kafka streaming, with a signal travelling along the pipeline.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B544" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5B544" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="210" rx="18" fill="#0A1422"/>

  <!-- rail -->
  <line x1="50" y1="95" x2="1050" y2="95" stroke="#2C5B86" stroke-width="2" stroke-dasharray="4 6"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="22" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#2C5B86" stroke-width="1.5"/>
    <text x="97" y="86" font-size="13" fill="#8FB8DE">Phase 1</text>
    <text x="97" y="112" font-size="17" font-weight="600" fill="#F3F6FA">Ingestion, EDA</text>
    <text x="97" y="165" font-size="13" fill="#C9D6E4">247M rows</text>
    <!-- 2 -->
    <rect x="202" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#2C5B86" stroke-width="1.5"/>
    <text x="277" y="86" font-size="13" fill="#8FB8DE">Phase 2</text>
    <text x="277" y="112" font-size="17" font-weight="600" fill="#F3F6FA">Cleaning</text>
    <text x="277" y="165" font-size="13" fill="#C9D6E4">0 rows dropped</text>
    <!-- 3 -->
    <rect x="382" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#2C5B86" stroke-width="1.5"/>
    <text x="457" y="86" font-size="13" fill="#8FB8DE">Phase 3</text>
    <text x="457" y="112" font-size="17" font-weight="600" fill="#F3F6FA">5-min windows</text>
    <text x="457" y="165" font-size="13" fill="#C9D6E4">50,220 windows</text>
    <!-- 4 -->
    <rect x="562" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#2C5B86" stroke-width="1.5"/>
    <text x="637" y="86" font-size="13" fill="#8FB8DE">Phase 4</text>
    <text x="637" y="112" font-size="17" font-weight="600" fill="#F3F6FA">Clustering</text>
    <text x="637" y="165" font-size="13" fill="#C9D6E4">175 variables</text>
    <!-- 5 -->
    <rect x="742" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#2C5B86" stroke-width="1.5"/>
    <text x="817" y="86" font-size="13" fill="#8FB8DE">Phase 5</text>
    <text x="817" y="112" font-size="17" font-weight="600" fill="#F3F6FA">Reduction, k</text>
    <text x="817" y="165" font-size="13" fill="#C9D6E4">47 variables, k = 2</text>
    <!-- 6 (accent) -->
    <rect x="922" y="55" width="150" height="80" rx="14" fill="#12304D" stroke="#F5B544" stroke-width="2"/>
    <text x="997" y="86" font-size="13" fill="#F5B544">Phase 6</text>
    <text x="997" y="112" font-size="17" font-weight="600" fill="#F3F6FA">Kafka streaming</text>
    <text x="997" y="165" font-size="13" fill="#C9D6E4">484,092 messages</text>
  </g>

  <!-- travelling signal -->
  <g>
    <circle r="14" fill="url(#glow)"/>
    <circle r="4" fill="#F5B544"/>
    <animateMotion dur="9s" repeatCount="indefinite" path="M50,95 L1050,95"/>
  </g>
</svg>
