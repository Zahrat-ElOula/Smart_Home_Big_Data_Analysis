<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Smart Home Big Data Analysis</title>
  <desc id="d">Animated banner: a sensor network with pulsing nodes and a light signal travelling between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1422"/>
      <stop offset="1" stop-color="#15385A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B544" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5B544" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- soft window-light on the left -->
    <ellipse cx="120" cy="40" rx="360" ry="200" fill="#8FB8DE" opacity="0.07"/>

    <!-- network links -->
    <g stroke="#8FB8DE" stroke-opacity="0.28" stroke-width="1.5" fill="none">
      <path d="M790,210 L870,95"/>
      <path d="M870,95 L960,180"/>
      <path d="M870,95 L1040,70"/>
      <path d="M960,180 L1040,70"/>
      <path d="M960,180 L1100,200"/>
      <path d="M1040,70 L1150,110"/>
      <path d="M1100,200 L1150,110"/>
    </g>

    <!-- nodes -->
    <g fill="#F3F6FA">
      <circle cx="790" cy="210" r="5"/>
      <circle cx="870" cy="95" r="5"/>
      <circle cx="960" cy="180" r="5"/>
      <circle cx="1040" cy="70" r="5"/>
      <circle cx="1100" cy="200" r="5"/>
      <circle cx="1150" cy="110" r="5"/>
    </g>

    <!-- pulse rings (staggered) -->
    <g fill="none" stroke="#F5B544" stroke-width="1.5">
      <circle cx="790" cy="210" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="95" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="180" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="70" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="200" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="110" r="5"><animate attributeName="r" values="5;26" dur="3.6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- travelling signal -->
    <g>
      <circle r="16" fill="url(#glow)"/>
      <circle r="4.5" fill="#F5B544"/>
      <animateMotion dur="7s" repeatCount="indefinite" path="M790,210 L870,95 L960,180 L1040,70 L1150,110"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="64" y="128" font-size="64" font-weight="700" fill="#F3F6FA" letter-spacing="-1">Smart Home
        <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
      </text>
      <text x="64" y="196" font-size="64" font-weight="300" fill="#8FB8DE" letter-spacing="-1">Big Data Analysis
        <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.35s" fill="freeze"/>
      </text>
      <text x="66" y="244" font-size="18" fill="#C9D6E4" opacity="0.9">247 million sensor measurements, PySpark, Kafka and KMeans</text>
    </g>

    <!-- amber hairline -->
    <rect x="64" y="262" width="96" height="3" rx="1.5" fill="#F5B544"/>
  </g>
</svg>
